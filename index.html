<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brenda Fashions</title>

<style>
:root{--brand:#dc5cff;--ink:#202333;--muted:#6b7280;--line:#e8eaf0;--soft:#f7f7fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);line-height:1.55}button,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.announcement{padding:8px 16px;text-align:center;background:#171827;color:#fff;font-size:12px}.site-header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 6%}.logo{font-size:23px;font-weight:850;letter-spacing:-.7px;overflow-wrap:anywhere;cursor:pointer}.nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.nav a, .nav button{font-size:13px;font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;padding:11px 16px;font-weight:750;background:var(--brand);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-outline{background:white;color:var(--ink);border:1px solid var(--line)}.hero{padding:clamp(50px,8vw,100px) 6%;text-align:center;background:linear-gradient(135deg,#f5f2ff,#fbfbff 60%,#f0f7ff)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--brand)}.hero h1{max-width:850px;margin:12px auto;font-size:clamp(32px,6vw,64px);line-height:1.06;letter-spacing:-2px}.hero p{max-width:650px;margin:16px auto 25px;color:var(--muted);font-size:16px}.section{padding:55px 6%}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}.section h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.8px;margin:0}.search{width:min(100%,300px);padding:11px 13px;border:1px solid var(--line);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.product{min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;background:#fff}.product img,.placeholder{width:100%;aspect-ratio:4/4.5;object-fit:cover;border-radius:9px;background:#f0f1f5}.product h3{margin:13px 0 4px;font-size:16px;overflow-wrap:anywhere}.desc{color:var(--muted);font-size:13px;margin:0;white-space:pre-wrap}.price{font-weight:850;font-size:18px;margin:12px 0}.buy{width:100%;margin-top:auto}.stock{font-size:11px;color:var(--muted);margin:8px 0 0}.empty{padding:35px;text-align:center;border:1px dashed #ccd0dc;border-radius:10px;color:var(--muted);grid-column:1/-1}.footer{background:#f7f7fa;border-top:1px solid var(--line);padding:28px 6%;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:#0008;display:flex;justify-content:flex-end;z-index:10}.drawer{background:white;width:min(460px,100%);height:100%;overflow:auto;padding:22px}.hidden{display:none!important}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.cartrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.cartrow img{width:66px;height:66px;object-fit:cover;border-radius:8px}.cartinfo{flex:1;min-width:0}.cartinfo small{display:block;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}.qty button{border:1px solid var(--line);background:white;border-radius:5px;padding:4px 9px}.total{font-size:20px;font-weight:850;margin:22px 0}.note{font-size:11px;color:var(--muted);line-height:1.5}.pay-label{width:100%;margin-top:8px}
.auth-page{max-width:420px;margin:50px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px}
</style></head><body>

<div class="announcement">Welcome to Brenda Fashions</div>
<header class="site-header"><a class="logo" id="logo"></a><nav class="nav" id="siteNav"></nav></header>
<main id="mainContent"></main>
<footer class="footer"><strong id="footerBrand"></strong><span id="footer"></span><div id="footerLinks" style="display:flex;gap:12px"></div></footer>
<div class="overlay hidden" id="overlay" role="dialog"><div class="drawer"><div class="drawer-head"><h2>Your cart</h2><button class="btn btn-outline" id="closeBtn">Close ✕</button></div><div id="cartItems"></div><div class="total" id="total"></div><button class="btn pay-label" id="checkout">Continue to checkout</button></div></div>
<script>
const DATA = {"settings":{"name":"Brenda Fashions","tagline":"Fashion To The Fullest","description":"More To Say By Your Design.","color":"#dc5cff","currency":"UGX","footer":"© 2026 Brenda Fashions. All rights reserved.","paymentLink":"","paymentLabel":"Buy","loginLabel":"Log In","registerLabel":"Sign Up"},"products":[{"id":"cf6d8100-a67e-4eba-b019-8c9986ce8803","name":"Plain V-Neck T.shirts","price":15000,"stock":10,"image":"https://tse4.mm.bing.net/th/id/OIP.AAROp2tQu8lBCsz3axfalwHaF7?r=0\u0026rs=1\u0026pid=ImgDetMain\u0026o=7\u0026rm=3","description":"Great Plain V-Neck Shirts"}],"links":[],"hiddenLinks":[]}; const s=DATA.settings, products=DATA.products, links=DATA.links; const cart={}; const $=id=>document.getElementById(id);
let view = "shop";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImage=x=>{if(/^data:image\/(png|jpeg|jpg|webp|avif|gif);base64,/i.test(String(x||"")))return String(x);try{const u=new URL(x,location.href);return ["http:","https:"].includes(u.protocol)?u.href:""}catch(e){return ""}};
const money=n=>{try{return new Intl.NumberFormat("en",{style:"currency",currency:s.currency||"UGX",maximumFractionDigits:["UGX","KES","TZS"].includes(s.currency)?0:2}).format(Number(n)||0)}catch(e){return (s.currency||"UGX")+" "+Number(n||0).toLocaleString()}};

function renderApp(){
  document.title=s.name||"Store";
  $("logo").textContent=s.name||"Store";
  $("footerBrand").textContent=s.name||"Store";
  $("footer").textContent=s.footer||"";
  $("checkout").textContent=s.paymentLabel||"Pay securely";
  document.documentElement.style.setProperty("--brand",/^#[0-9a-f]{6}$/i.test(s.color||"")?s.color:"#635bff");

  let navHtml='<a href="#home" data-home>Home</a><a href="#shop" data-shop>Shop</a>';
  links.filter(l=>!l.placement || l.placement==='header' || l.placement==='both').forEach(l=>{ navHtml+='<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.title)+'</a>'; });
  const isLoggedIn=localStorage.getItem("loginuser");
  if(isLoggedIn){
    navHtml+='<span style="font-size:13px;color:#18865a;font-weight:700;">✓ Signed In</span><button style="background:none;border:0;cursor:pointer;color:#b42318;font:inherit;font-weight:700;" id="logoutNav">Sign Out</button>';
  } else {
    navHtml+='<button style="background:none;border:0;cursor:pointer;color:inherit;font:inherit;" id="loginNav">'+esc(s.loginLabel||'Sign in')+'</button>';
    navHtml+='<button style="background:none;border:0;cursor:pointer;color:inherit;font:inherit;font-weight:bold;color:'+esc(s.color)+'" id="registerNav">'+esc(s.registerLabel||'Create Account')+'</button>';
  }
  navHtml+='<button class="btn" id="cartBtn">Cart (0)</button>';
  $("siteNav").innerHTML=navHtml;

  let footerLinksHtml='';
  links.filter(l=>l.placement==='footer' || l.placement==='both').forEach(l=>{ footerLinksHtml+='<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.title)+'</a>'; });
  $("footerLinks").innerHTML=footerLinksHtml;

  if(view==="login"){
    $("mainContent").innerHTML='<div class="auth-page"><h2 style="margin-top:0;margin-bottom:20px;">'+esc(s.loginLabel||'Sign in')+'</h2><form id="standaloneLoginForm"><div class="field"><label>Email</label><input type="email" id="sEmail" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" id="sPass" required placeholder="••••••••"></div><button class="btn pay-label" type="submit">Sign In</button></form><p style="text-align:center;font-size:13px;margin-top:15px">Don\'t have an account? <a href="#" id="toReg" style="color:'+esc(s.color)+';font-weight:700;">Create Account</a></p></div>';
    $("standaloneLoginForm").onsubmit=e=>{e.preventDefault();localStorage.setItem("loginuser",$("sEmail").value.trim());view="shop";renderApp();alert("Signed in successfully!")};
    $("toReg").onclick=e=>{e.preventDefault();view="register";renderApp();};
  } else if(view==="register"){
    $("mainContent").innerHTML='<div class="auth-page"><h2 style="margin-top:0;margin-bottom:20px;">'+esc(s.registerLabel||'Create Account')+'</h2><form id="standaloneRegForm"><div class="field"><label>Full Name</label><input type="text" id="rName" required placeholder="John Doe"></div><div class="field"><label>Email</label><input type="email" id="rEmail" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" id="rPass" required placeholder="••••••••"></div><button class="btn pay-label" type="submit">Create Account</button></form><p style="text-align:center;font-size:13px;margin-top:15px">Already have an account? <a href="#" id="toLog" style="color:'+esc(s.color)+';font-weight:700;">Sign In</a></p></div>';
    $("standaloneRegForm").onsubmit=e=>{e.preventDefault();localStorage.setItem("loginuser",$("rEmail").value.trim());view="shop";renderApp();alert("Account created and signed in!")};
    $("toLog").onclick=e=>{e.preventDefault();view="login";renderApp();};
  } else {
    $("mainContent").innerHTML='<section class="hero" id="home"><div class="eyebrow">Welcome to our store</div><h1 id="headline">'+esc(s.tagline)+'</h1><p id="intro">'+esc(s.description)+'</p><a class="btn" href="#shop" data-shop-btn>Explore collection ↓</a></section><section class="section" id="shop"><div class="section-head"><div><h2>Shop collection</h2></div><input class="search" id="search" type="search" placeholder="Search products…"></div><div class="grid" id="products"></div></section>';
    renderProducts();
    $("search").addEventListener("input",renderProducts);
  }

  if($("loginNav")) $("loginNav").onclick=()=>{view="login";renderApp();};
  if($("registerNav")) $("registerNav").onclick=()=>{view="register";renderApp();};
  if($("logoutNav")) $("logoutNav").onclick=()=>{localStorage.removeItem("loginuser");renderApp();alert("Signed out successfully.")};
  if($("cartBtn")) $("cartBtn").onclick=()=>{$("overlay").classList.remove("hidden");renderCart()};
  if($("logo")) $("logo").onclick=()=>{view="shop";renderApp();window.scrollTo(0,0)};
  document.querySelectorAll("[data-home]").forEach(el=>el.onclick=e=>{e.preventDefault();view="shop";renderApp();window.scrollTo(0,0)});
  document.querySelectorAll("[data-shop], [data-shop-btn]").forEach(el=>el.onclick=e=>{e.preventDefault();view="shop";renderApp();const elShop=$("shop");if(elShop)elShop.scrollIntoView({behavior:"smooth"})});
}

function renderProducts(){
  if(!$("products")) return;
  const q=$("search").value.trim().toLowerCase();
  const shown=products.filter(p=>(p.name+" "+(p.description||"")).toLowerCase().includes(q));
  $("products").innerHTML=shown.map(p=>'<article class="product">'+(safeImage(p.image)?'<img loading="lazy" src="'+esc(safeImage(p.image))+'" alt="">':'<div class="placeholder"></div>')+'<h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.description||"")+'</p><div class="price">'+money(p.price)+'</div>'+(p.stock>0?'<button class="btn buy" data-add="'+esc(p.id)+'">Add to cart</button>':'<button class="btn buy" disabled>Out of stock</button>')+'<p class="stock">'+(p.stock>0?Number(p.stock)+' available':'Unavailable')+'</p></article>').join("")||'<div class="empty">No products match.</div>';
}

function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function renderCart(){$("cartBtn").textContent="Cart ("+count()+")";const items=products.filter(p=>cart[p.id]>0);$("cartItems").innerHTML=items.map(p=>'<div class="cartrow">'+(safeImage(p.image)?'<img src="'+esc(safeImage(p.image))+'" alt="">':'')+'<div class="cartinfo"><strong>'+esc(p.name)+'</strong><small>'+money(p.price)+'</small><div class="qty"><button data-minus="'+esc(p.id)+'">−</button><span>'+cart[p.id]+'</span><button data-plus="'+esc(p.id)+'">+</button><button data-remove="'+esc(p.id)+'">Remove</button></div></div></div>').join("")||'<p class="note">Your cart is empty.</p>';$("total").textContent="Total: "+money(items.reduce((n,p)=>n+Number(p.price||0)*cart[p.id],0));$("checkout").disabled=!items.length}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-add]");
  if(!b)return;
  try{
    if(!localStorage.getItem("loginuser")){
      alert("Please sign in or create an account first!");
      view="login";
      renderApp();
      return;
    }
  }catch(err){ alert("Authentication check failed."); return; }
  const p=products.find(x=>x.id===b.dataset.add);
  if(p&&p.stock>(cart[p.id]||0)){cart[p.id]=(cart[p.id]||0)+1;renderCart()}else alert("Stock limit reached.")
});

$("cartItems").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.plus||b.dataset.minus||b.dataset.remove;const p=products.find(x=>x.id===id);if(!p)return;if(b.dataset.plus){if((cart[id]||0)<p.stock)cart[id]++;else alert("Limit reached")}if(b.dataset.minus){cart[id]--;if(cart[id]<=0)delete cart[id]}if(b.dataset.remove)delete cart[id];renderCart()});

$("closeBtn").onclick=()=>$("overlay").classList.add("hidden");
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay")) $("overlay").classList.add("hidden");});
$("checkout").onclick=()=>{if(!s.paymentLink){alert("Payment link not configured.");return}window.open(s.paymentLink,"_blank","noopener,noreferrer")};

renderApp();
renderCart();
</script></body></html>
